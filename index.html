<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thronefall — Defesa Medieval</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a14;
  display:flex; align-items:center; justify-content:center;
  height:100vh; overflow:hidden;
  font-family:'Georgia',serif;
}
#canvas {
  display:block;
  max-width:100vw; max-height:100vh;
  cursor:pointer;
  image-rendering:pixelated;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
'use strict';

/* =============================================
   DIMENSÕES E CONSTANTES
   ============================================= */
const CELL   = 40;
const COLS   = 21;
const ROWS   = 14;
const HUD_H  = 54;
const W      = COLS * CELL;          // 840
const GAME_H = ROWS * CELL;          // 560
const H      = HUD_H + GAME_H;       // 614

// Posição do castelo (centro do mapa)
const CX = 10, CY = 6;

// Células do castelo (3×3)
const CASTLE_SET = new Set();
for (let r = CY-1; r <= CY+1; r++)
  for (let c = CX-1; c <= CX+1; c++)
    CASTLE_SET.add(`${c},${r}`);

// Células do caminho (cruz)
const PATH_SET = new Set();
for (let r = 0; r < ROWS; r++) PATH_SET.add(`${CX},${r}`);
for (let c = 0; c < COLS; c++) PATH_SET.add(`${c},${CY}`);

// Helpers de coordenada
const gcx = c => c * CELL + CELL/2;
const gcy = r => HUD_H + r * CELL + CELL/2;
const gtx = c => c * CELL;
const gty = r => HUD_H + r * CELL;

const dist  = (ax,ay,bx,by) => Math.hypot(bx-ax,by-ay);
const rng   = (a,b) => a + Math.random()*(b-a);
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));

function screenToCell(sx,sy){
  return { c: Math.floor(sx/CELL), r: Math.floor((sy-HUD_H)/CELL) };
}
function isBuildable(c,r){
  if(c<0||c>=COLS||r<0||r>=ROWS) return false;
  const k=`${c},${r}`;
  return !PATH_SET.has(k) && !CASTLE_SET.has(k);
}

/* =============================================
   DEFINIÇÕES DE TORRES
   ============================================= */
const TOWER_DEFS = {
  archer:{
    name:'Arqueiro', cost:25, range:135, damage:20, rate:1.4,
    color:'#4CAF50', dark:'#2E7D32', projColor:'#C8E6C9', projSize:4, aoe:0,
    desc:'Rápido e barato'
  },
  catapult:{
    name:'Catapulta', cost:60, range:105, damage:65, rate:0.45,
    color:'#FF9800', dark:'#E65100', projColor:'#FFE082', projSize:8, aoe:52,
    desc:'Dano em área'
  },
  ballista:{
    name:'Balista', cost:80, range:210, damage:90, rate:0.5,
    color:'#607D8B', dark:'#37474F', projColor:'#CFD8DC', projSize:5, aoe:0,
    desc:'Longo alcance'
  },
  barricade:{
    name:'Barricada', cost:15, range:0, damage:0, rate:0,
    color:'#8D6E63', dark:'#4E342E', projColor:null, projSize:0, aoe:0,
    slowRange:58, slow:0.45,
    desc:'Reduz velocidade'
  }
};

/* =============================================
   DEFINIÇÕES DE INIMIGOS
   ============================================= */
const ENEMY_DEFS = {
  goblin:{ name:'Goblin', hp:50,  speed:80, reward:8,  size:12, color:'#66BB6A', dark:'#388E3C' },
  orc:   { name:'Orc',    hp:200, speed:38, reward:22, size:18, color:'#A1887F', dark:'#5D4037' },
  troll: { name:'Troll',  hp:550, speed:22, reward:65, size:25, color:'#78909C', dark:'#455A64' }
};

/* =============================================
   CONFIGURAÇÃO DE ONDAS
   ============================================= */
const WAVE_CFGS = [
  { goblin:8,  orc:0, troll:0 },
  { goblin:12, orc:3, troll:0 },
  { goblin:15, orc:5, troll:1 },
  { goblin:18, orc:7, troll:1 },
  { goblin:22, orc:9, troll:2 }
];

/* =============================================
   ESTADO DO JOGO
   ============================================= */
let state       = 'menu';
let wave        = 0;
let coins       = 50;
let castleHP    = 300;
const CASTLE_MAX_HP = 300;
let dayTimer    = 30;
const DAY_SEC   = 30;

let towers      = [];
let enemies     = [];
let coinDrops   = [];
let projectiles = [];
let particles   = [];
let spawnQueue  = [];
let spawnTimer  = 0;
let buildMenu   = null;   // { c, r, px, py }
let transTimer  = 0;

const player = {
  x:0, y:0, tx:0, ty:0,
  speed:115, radius:13,
  atkRange:46, atkDmg:18,
  color:'#E8D44D', dark:'#F57F17'
};

/* =============================================
   UTILIDADES DE DESENHO
   ============================================= */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function spawnParticles(x,y,color,n,maxSpd){
  const ms = maxSpd||120;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rng(30,ms);
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rng(0.3,0.65), maxLife:0.5, size:rng(2,5), color });
  }
}

function spawnFloatText(x,y,text,color){
  particles.push({ type:'text', x, y, vy:-45, life:1.1, maxLife:1.1, text, color, size:14 });
}

/* =============================================
   CLASSE: TORRE
   ============================================= */
class Tower {
  constructor(c,r,type){
    this.c=c; this.r=r; this.type=type;
    const d=TOWER_DEFS[type];
    Object.assign(this,d);
    this.x=gcx(c); this.y=gcy(r);
    this.cooldown=0; this.target=null; this.angle=0;
  }
  update(dt,enms){
    if(this.rate===0) return;
    if(this.cooldown>0) this.cooldown-=dt;
    let best=null,bestD=Infinity;
    for(const e of enms){
      const d=dist(this.x,this.y,e.x,e.y);
      if(d<=this.range && d<bestD){ best=e; bestD=d; }
    }
    this.target=best;
    if(best){
      this.angle=Math.atan2(best.y-this.y,best.x-this.x);
      if(this.cooldown<=0){
        this.fire(best);
        this.cooldown=1/this.rate;
      }
    }
  }
  fire(target){
    const spd=this.type==='ballista'?390:270;
    projectiles.push({
      x:this.x, y:this.y, tx:target.x, ty:target.y,
      target, speed:spd, damage:this.damage,
      color:this.projColor, size:this.projSize, aoe:this.aoe
    });
  }
  draw(ctx){
    const d=TOWER_DEFS[this.type];
    const x=this.x, y=this.y, s=CELL*0.42;
    // Sombra
    ctx.fillStyle='rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x+3,y+s*0.5+3,s*0.85,s*0.35,0,0,Math.PI*2); ctx.fill();
    // Base
    ctx.save(); ctx.translate(x,y);
    roundRect(ctx,-s,-s,s*2,s*2,6); ctx.fillStyle=d.dark; ctx.fill();
    roundRect(ctx,-s+2,-s+2,s*2-4,s*2-4,5); ctx.fillStyle=d.color; ctx.fill();
    // Cano/símbolo
    const ang=this.target?this.angle:-Math.PI/4;
    if(this.type==='archer'){
      ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(-7*Math.cos(ang),-7*Math.sin(ang));
      ctx.lineTo(10*Math.cos(ang),10*Math.sin(ang)); ctx.stroke();
    } else if(this.type==='catapult'){
      ctx.fillStyle=d.dark; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFE082'; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    } else if(this.type==='ballista'){
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath();
      ctx.moveTo(-11*Math.cos(ang),-11*Math.sin(ang));
      ctx.lineTo(13*Math.cos(ang),13*Math.sin(ang)); ctx.stroke();
    } else if(this.type==='barricade'){
      ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(-7,-7); ctx.lineTo(7,7); ctx.moveTo(7,-7); ctx.lineTo(-7,7); ctx.stroke();
    }
    ctx.restore();
    // Alcance (hover futuro — não desenha por padrão)
  }
}

/* =============================================
   CLASSE: INIMIGO
   ============================================= */
class Enemy {
  constructor(type,dir){
    this.type=type; this.dir=dir;
    const d=ENEMY_DEFS[type];
    this.name=d.name; this.maxHP=d.hp; this.hp=d.hp;
    this.baseSpd=d.speed; this.speed=d.speed;
    this.reward=d.reward; this.size=d.size;
    this.color=d.color; this.dark=d.dark;
    this.dead=false; this.reachedCastle=false; this.slowTimer=0;
    switch(dir){
      case'N': this.x=gcx(CX); this.y=HUD_H-CELL; break;
      case'S': this.x=gcx(CX); this.y=HUD_H+GAME_H+CELL; break;
      case'E': this.x=W+CELL;  this.y=gcy(CY); break;
      case'W': this.x=-CELL;   this.y=gcy(CY); break;
    }
    this.destX=gcx(CX); this.destY=gcy(CY);
  }
  update(dt){
    if(this.dead) return;
    this.speed = this.slowTimer>0 ? this.baseSpd*0.42 : this.baseSpd;
    if(this.slowTimer>0) this.slowTimer-=dt;
    const dx=this.destX-this.x, dy=this.destY-this.y;
    const d=Math.hypot(dx,dy);
    if(d < this.size+3){
      this.dead=true; this.reachedCastle=true;
      castleHP=Math.max(0, castleHP - Math.floor(this.maxHP*0.13+5));
      spawnParticles(this.x,this.y,'#F44336',8);
    } else {
      this.x+=(dx/d)*this.speed*dt;
      this.y+=(dy/d)*this.speed*dt;
    }
  }
  draw(ctx){
    if(this.dead) return;
    const x=this.x, y=this.y, s=this.size;
    // Sombra
    ctx.fillStyle='rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(x+2,y+s*0.65+2,s*0.75,s*0.28,0,0,Math.PI*2); ctx.fill();
    // Corpo
    ctx.fillStyle=this.dark;
    ctx.beginPath(); ctx.arc(x,y,s+1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
    // Olhos
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(x-s*0.3,y-s*0.2,s*0.2,0,Math.PI*2);
    ctx.arc(x+s*0.3,y-s*0.2,s*0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();
    ctx.arc(x-s*0.28,y-s*0.2,s*0.1,0,Math.PI*2);
    ctx.arc(x+s*0.28,y-s*0.2,s*0.1,0,Math.PI*2); ctx.fill();
    // HP bar
    if(this.hp<this.maxHP){
      const bw=s*2.4, bh=4, bx=x-bw/2, by=y-s-10;
      ctx.fillStyle='#222'; ctx.fillRect(bx,by,bw,bh);
      const pct=this.hp/this.maxHP;
      ctx.fillStyle=pct>0.5?'#4CAF50':pct>0.25?'#FFC107':'#F44336';
      ctx.fillRect(bx,by,bw*pct,bh);
    }
    // Lentidão
    if(this.slowTimer>0){
      ctx.strokeStyle='rgba(120,180,255,0.75)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,s+5,0,Math.PI*2); ctx.stroke();
    }
  }
}

/* =============================================
   CLASSE: MOEDA DROPADA
   ============================================= */
class CoinDrop {
  constructor(x,y,amount){
    this.x=x+rng(-18,18); this.y=y+rng(-18,18);
    this.amount=amount; this.radius=7;
    this.life=16; this.age=0;
    this.bob=Math.random()*Math.PI*2;
    this.done=false;
  }
  update(dt){
    this.age+=dt;
    if(this.age>this.life) this.done=true;
  }
  draw(ctx){
    if(this.done) return;
    const alpha=this.age>this.life-3?(this.life-this.age)/3:1;
    const pulse=1+Math.sin(Date.now()*0.005+this.bob)*0.14;
    const s=this.radius*pulse;
    ctx.save(); ctx.globalAlpha=alpha;
    // Brilho
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,s*2.8);
    g.addColorStop(0,'rgba(255,215,0,0.45)'); g.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,s*2.8,0,Math.PI*2); ctx.fill();
    // Moeda
    ctx.fillStyle='#B8860B'; ctx.beginPath(); ctx.arc(this.x,this.y,s+1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(this.x,this.y,s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath();
    ctx.arc(this.x-s*0.28,this.y-s*0.28,s*0.3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* =============================================
   CONSTRUÇÃO DE ONDA
   ============================================= */
function buildWave(n){
  const idx=Math.min(n-1,WAVE_CFGS.length-1);
  const cfg=WAVE_CFGS[idx];
  const mult=n>WAVE_CFGS.length?1+(n-WAVE_CFGS.length)*0.35:1;
  const dirs=['N','S','E','W'];
  const q=[];
  const add=(type,count)=>{
    for(let i=0;i<Math.floor(count*mult);i++)
      q.push({ type, dir:dirs[i%4], delay:i*rng(0.9,1.9) });
  };
  add('goblin',cfg.goblin); add('orc',cfg.orc); add('troll',cfg.troll);
  q.sort((a,b)=>a.delay-b.delay);
  return q;
}

/* =============================================
   FUNÇÕES DE DESENHO — CENÁRIO
   ============================================= */
function drawBackground(ctx){
  const isDay=state==='day';
  // Céu
  const sky=ctx.createLinearGradient(0,0,0,HUD_H+GAME_H);
  if(isDay){
    sky.addColorStop(0,'#6BAED6'); sky.addColorStop(0.4,'#9ECAE1');
    sky.addColorStop(1,'#C6DBEF');
  } else {
    sky.addColorStop(0,'#08102B'); sky.addColorStop(0.5,'#0D1B4D');
    sky.addColorStop(1,'#152360');
  }
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // Estrelas
  if(!isDay){
    ctx.fillStyle='rgba(255,255,255,0.85)';
    [[45,12],[115,7],[195,19],[300,5],[415,17],[525,9],[625,21],[730,6],[800,13],[160,30],[350,25]].forEach(([sx,sy])=>{
      ctx.beginPath(); ctx.arc(sx,sy,1.4,0,Math.PI*2); ctx.fill();
    });
  }
  // Chão
  const gnd=ctx.createLinearGradient(0,HUD_H,0,H);
  if(isDay){
    gnd.addColorStop(0,'#3A7D1E'); gnd.addColorStop(1,'#2A5C10');
  } else {
    gnd.addColorStop(0,'#1A3A0D'); gnd.addColorStop(1,'#0E2208');
  }
  ctx.fillStyle=gnd; ctx.fillRect(0,HUD_H,W,GAME_H);
  // Grade sutil
  ctx.strokeStyle=isDay?'rgba(0,0,0,0.055)':'rgba(0,0,0,0.09)'; ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,HUD_H); ctx.lineTo(c*CELL,H); ctx.stroke(); }
  for(let r=0;r<=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,HUD_H+r*CELL); ctx.lineTo(W,HUD_H+r*CELL); ctx.stroke(); }
}

function drawPaths(ctx){
  const isDay=state==='day';
  const pColor=isDay?'#C4A96D':'#8B7355';
  const pDark=isDay?'#A8894A':'#6B5535';
  for(const key of PATH_SET){
    if(CASTLE_SET.has(key)) continue;
    const [c,r]=key.split(',').map(Number);
    ctx.fillStyle=pDark; ctx.fillRect(gtx(c),gty(r),CELL,CELL);
    ctx.fillStyle=pColor; ctx.fillRect(gtx(c)+1,gty(r)+1,CELL-2,CELL-2);
  }
}

function drawCastle(ctx){
  const isDay=state==='day';
  const cx=gcx(CX), cy=gcy(CY);
  const tw=CELL*1.6, th=CELL*1.7;
  // Base
  ctx.fillStyle=isDay?'#546E7A':'#37474F';
  roundRect(ctx,cx-tw,cy-th*0.65,tw*2,th,10); ctx.fill();
  ctx.fillStyle=isDay?'#607D8B':'#455A64';
  roundRect(ctx,cx-tw+3,cy-th*0.65+3,tw*2-6,th-6,8); ctx.fill();
  // Ameias
  const am=[[-32,-18,0],[-10,-18,0],[12,-18,0]];
  ctx.fillStyle=isDay?'#546E7A':'#37474F';
  am.forEach(([ox])=>{ ctx.fillRect(cx+ox,cy-th*0.65-15,16,15); });
  // Porta
  ctx.fillStyle=isDay?'#2C1810':'#1A0F0A';
  ctx.beginPath(); ctx.arc(cx,cy+th*0.15,17,Math.PI,0);
  ctx.fillRect(cx-17,cy+th*0.15,34,22); ctx.fill();
  // Janelas
  [[cx-30,cy-th*0.22],[cx+30,cy-th*0.22]].forEach(([wx,wy])=>{
    ctx.fillStyle=isDay?'#FFF176':'#FFA000';
    ctx.beginPath(); ctx.arc(wx,wy,7,Math.PI,0);
    ctx.fillRect(wx-7,wy,14,9); ctx.fill();
  });
  // Bandeira
  const fy=cy-th*0.65-12;
  ctx.strokeStyle='#78909C'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cx,fy); ctx.lineTo(cx,fy-30); ctx.stroke();
  ctx.fillStyle='#F44336';
  ctx.beginPath(); ctx.moveTo(cx,fy-30); ctx.lineTo(cx+18,fy-23); ctx.lineTo(cx,fy-16); ctx.closePath(); ctx.fill();
  // HP bar
  const bw=72, bh=8, bx=cx-bw/2, by=cy+th*0.38;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
  ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,bh);
  const pct=castleHP/CASTLE_MAX_HP;
  ctx.fillStyle=pct>0.5?'#4CAF50':pct>0.25?'#FFC107':'#F44336';
  ctx.fillRect(bx,by,bw*pct,bh);
}

function drawPlayer(ctx){
  const x=player.x, y=player.y, r=player.radius;
  // Sombra
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x+2,y+r*0.65+2,r*0.82,r*0.28,0,0,Math.PI*2); ctx.fill();
  // Capa
  ctx.fillStyle='#C62828';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.35,r*0.68,r*0.95,0,0,Math.PI*2); ctx.fill();
  // Corpo
  ctx.fillStyle=player.dark;
  ctx.beginPath(); ctx.arc(x,y,r+1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=player.color;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  // Coroa
  ctx.fillStyle='#FFC107';
  ctx.beginPath();
  ctx.moveTo(x-r*0.62,y-r*0.5); ctx.lineTo(x-r*0.62,y-r*0.92);
  ctx.lineTo(x-r*0.3,y-r*0.68); ctx.lineTo(x,y-r*0.96);
  ctx.lineTo(x+r*0.3,y-r*0.68); ctx.lineTo(x+r*0.62,y-r*0.92);
  ctx.lineTo(x+r*0.62,y-r*0.5); ctx.closePath(); ctx.fill();
  // Espada
  const ang=Math.atan2(player.ty-y,player.tx-x);
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.strokeStyle='#B0BEC5'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(r+14,0); ctx.stroke();
  ctx.fillStyle='#90A4AE'; ctx.fillRect(r+7,-4,9,3);
  ctx.restore();
  // Raio de coleta
  ctx.strokeStyle='rgba(255,215,0,0.22)'; ctx.lineWidth=1;
  ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.arc(x,y,58,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
}

function drawHUD(ctx){
  const isDay=state==='day';
  // Fundo
  const g=ctx.createLinearGradient(0,0,0,HUD_H);
  g.addColorStop(0,isDay?'#1A237E':'#06091A');
  g.addColorStop(1,isDay?'#283593':'#0D1230');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HUD_H);
  ctx.strokeStyle=isDay?'rgba(57,73,171,0.8)':'rgba(30,40,90,0.8)';
  ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,HUD_H); ctx.lineTo(W,HUD_H); ctx.stroke();
  // Moedas
  ctx.fillStyle='#B8860B'; ctx.beginPath(); ctx.arc(20,27,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(20,27,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7B5800'; ctx.font='bold 9px Georgia'; ctx.textAlign='center'; ctx.fillText('G',20,31);
  ctx.fillStyle='#FFD700'; ctx.font='bold 20px Georgia'; ctx.textAlign='left'; ctx.fillText(coins,36,33);
  // Castelo HP
  ctx.fillStyle='#fff'; ctx.font='16px Georgia'; ctx.fillText('🏰',135,33);
  const chpPct=castleHP/CASTLE_MAX_HP;
  ctx.fillStyle=chpPct>0.5?'#4CAF50':chpPct>0.25?'#FFC107':'#F44336';
  ctx.font='bold 15px Georgia'; ctx.fillText(`${castleHP}`,160,33);
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='13px Georgia'; ctx.fillText(`/${CASTLE_MAX_HP}`,180,33);
  // Centro — fase
  ctx.textAlign='center';
  if(isDay){
    ctx.fillStyle='#FFD700'; ctx.font='bold 14px Georgia';
    ctx.fillText(`☀  DIA  —  Onda ${wave+1} chegando`,W/2,19);
    const t=Math.ceil(dayTimer);
    ctx.fillStyle=t<=10?'#FF5252':'#fff'; ctx.font='bold 20px Georgia';
    ctx.fillText(`${t}s`,W/2,42);
  } else if(state==='night'){
    ctx.fillStyle='#90CAF9'; ctx.font='bold 14px Georgia';
    ctx.fillText(`🌙  NOITE  —  Onda ${wave}`,W/2,19);
    ctx.fillStyle='#fff'; ctx.font='14px Georgia';
    const rem=enemies.filter(e=>!e.dead).length+spawnQueue.length;
    ctx.fillText(`Inimigos restantes: ${rem}`,W/2,40);
  } else if(state==='transition'){
    ctx.fillStyle='#FFD700'; ctx.font='bold 16px Georgia';
    ctx.fillText('☀  Preparando próximo dia...',W/2,30);
  }
  // Torres
  ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.font='13px Georgia'; ctx.fillText(`Torres: ${towers.length}`,W-10,33);
}

function drawBuildMenu(ctx){
  if(!buildMenu) return;
  const {c,r}=buildMenu;
  // Destaque célula
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(gtx(c),gty(r),CELL,CELL);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2.5; ctx.strokeRect(gtx(c),gty(r),CELL,CELL);
  // Painel
  const PW=202, PH=186;
  let px=gcx(c)-PW/2, py=gcy(r)-PH-22;
  if(px<4) px=4; if(px+PW>W-4) px=W-PW-4;
  if(py<HUD_H+4) py=gcy(r)+24;
  buildMenu.px=px; buildMenu.py=py; buildMenu.PW=PW; buildMenu.PH=PH;
  // Fundo
  ctx.fillStyle='rgba(10,16,42,0.97)';
  roundRect(ctx,px,py,PW,PH,10); ctx.fill();
  ctx.strokeStyle='#3949AB'; ctx.lineWidth=2;
  roundRect(ctx,px,py,PW,PH,10); ctx.stroke();
  // Título
  ctx.fillStyle='#FFD700'; ctx.font='bold 14px Georgia'; ctx.textAlign='center';
  ctx.fillText('🏗  Construir torre',px+PW/2,py+22);
  // Botões
  const types=Object.keys(TOWER_DEFS);
  const btnH=33, btnPad=8;
  types.forEach((type,i)=>{
    const d=TOWER_DEFS[type];
    const by=py+32+i*(btnH+4);
    const canAfford=coins>=d.cost;
    buildMenu[`btn${i}`]={x:px+btnPad,y:by,w:PW-btnPad*2,h:btnH,type};
    ctx.fillStyle=canAfford
      ?(buildMenu.hover===i?'rgba(57,73,171,0.55)':'rgba(25,35,75,0.85)')
      :'rgba(15,15,25,0.6)';
    roundRect(ctx,px+btnPad,by,PW-btnPad*2,btnH,6); ctx.fill();
    ctx.strokeStyle=canAfford?d.color:'#444'; ctx.lineWidth=1.5;
    roundRect(ctx,px+btnPad,by,PW-btnPad*2,btnH,6); ctx.stroke();
    // Bolinha de cor
    ctx.fillStyle=canAfford?d.color:'#555';
    ctx.beginPath(); ctx.arc(px+btnPad+15,by+btnH/2,7,0,Math.PI*2); ctx.fill();
    // Nome
    ctx.fillStyle=canAfford?'#fff':'#555'; ctx.font='bold 13px Georgia'; ctx.textAlign='left';
    ctx.fillText(d.name,px+btnPad+28,by+13);
    ctx.fillStyle=canAfford?'#aaa':'#444'; ctx.font='11px Georgia';
    ctx.fillText(d.desc,px+btnPad+28,by+26);
    // Custo
    ctx.fillStyle=canAfford?'#FFD700':'#555'; ctx.font='bold 13px Georgia'; ctx.textAlign='right';
    ctx.fillText(`${d.cost}G`,px+PW-btnPad*2+2,by+btnH/2+5);
  });
}

function drawMenu(ctx){
  ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);
  // Título
  const tg=ctx.createLinearGradient(0,H*0.18,0,H*0.3);
  tg.addColorStop(0,'#FFD700'); tg.addColorStop(1,'#FFA000');
  ctx.fillStyle=tg; ctx.font='bold 54px Georgia'; ctx.textAlign='center';
  ctx.fillText('THRONEFALL',W/2,H*0.26);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='italic 19px Georgia';
  ctx.fillText('Defesa Medieval',W/2,H*0.34);
  // Divisor
  ctx.strokeStyle='rgba(255,165,0,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W/2-120,H*0.38); ctx.lineTo(W/2+120,H*0.38); ctx.stroke();
  // Instruções
  const lines=[
    '⚔  Clique no terreno para mover seu herói',
    '💰  Colete as moedas dropadas pelos inimigos',
    '🏗  Durante o dia, clique num terreno vazio para construir',
    '🌙  À noite os inimigos atacam o castelo em ondas',
    '🏰  Proteja o castelo — se cair, é fim de jogo',
  ];
  ctx.fillStyle='#CFD8DC'; ctx.font='15px Georgia';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,H*0.46+i*27));
  // Botão
  const bx=W/2-110,by=H*0.78,bw=220,bh=52;
  const bg=ctx.createLinearGradient(bx,by,bx,by+bh);
  bg.addColorStop(0,'#1565C0'); bg.addColorStop(1,'#0D47A1');
  roundRect(ctx,bx,by,bw,bh,12); ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle='#42A5F5'; ctx.lineWidth=2;
  roundRect(ctx,bx,by,bw,bh,12); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 21px Georgia'; ctx.textAlign='center';
  ctx.fillText('▶  Começar jogo',W/2,by+34);
}

function drawGameOver(ctx){
  ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#F44336'; ctx.font='bold 58px Georgia'; ctx.textAlign='center';
  ctx.fillText('DERROTA',W/2,H*0.32);
  ctx.fillStyle='#B0BEC5'; ctx.font='21px Georgia';
  ctx.fillText('O castelo foi destruído...',W/2,H*0.44);
  ctx.fillStyle='#fff'; ctx.font='17px Georgia';
  ctx.fillText(`Você sobreviveu até a onda ${wave}`,W/2,H*0.54);
  const bx=W/2-110,by=H*0.68,bw=220,bh=52;
  roundRect(ctx,bx,by,bw,bh,12); ctx.fillStyle='#B71C1C'; ctx.fill();
  ctx.strokeStyle='#EF9A9A'; ctx.lineWidth=2;
  roundRect(ctx,bx,by,bw,bh,12); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 20px Georgia';
  ctx.fillText('↺  Jogar novamente',W/2,by+34);
}

/* =============================================
   LÓGICA DE JOGO
   ============================================= */
function startGame(){
  state='day'; wave=0; coins=50; castleHP=CASTLE_MAX_HP;
  dayTimer=DAY_SEC; towers=[]; enemies=[]; coinDrops=[];
  projectiles=[]; particles=[]; spawnQueue=[]; spawnTimer=0;
  buildMenu=null; transTimer=0;
  player.x=gcx(CX+4); player.y=gcy(CY+3);
  player.tx=player.x; player.ty=player.y;
}

function startNight(){
  state='night'; wave++;
  spawnQueue=buildWave(wave); spawnTimer=0; buildMenu=null;
}

function startDay(){
  state='day'; dayTimer=DAY_SEC; buildMenu=null;
  spawnQueue=[]; spawnTimer=0;
  // Bônus de ouro ao sobreviver
  coins+=20+wave*5;
  spawnFloatText(gcx(CX),gcy(CY)-40,`+${20+wave*5}G bônus!`,'#FFD700');
}

function update(dt){
  if(state==='day'){
    dayTimer-=dt;
    if(dayTimer<=0) startNight();
  }
  if(state==='night'){
    // Spawn
    spawnTimer+=dt;
    while(spawnQueue.length>0 && spawnTimer>=spawnQueue[0].delay){
      const s=spawnQueue.shift();
      enemies.push(new Enemy(s.type,s.dir));
    }
    // Atualiza inimigos
    for(const e of enemies) e.update(dt);
    // Remove mortos e dropa moedas
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(!e.dead) continue;
      if(!e.reachedCastle){
        const n=Math.max(1,Math.round(e.reward/8));
        for(let j=0;j<n;j++) coinDrops.push(new CoinDrop(e.x,e.y,Math.ceil(e.reward/n)));
        spawnParticles(e.x,e.y,e.color,10);
      }
      enemies.splice(i,1);
    }
    // Barricadas — desaceleram inimigos
    for(const t of towers){
      if(t.type!=='barricade') continue;
      for(const e of enemies){
        if(dist(t.x,t.y,e.x,e.y)<=t.slowRange) e.slowTimer=0.3;
      }
    }
    // Torres atacam
    for(const t of towers) t.update(dt,enemies);
    // Projéteis
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      if(p.target&&!p.target.dead){ p.tx=p.target.x; p.ty=p.target.y; }
      const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
      if(d<p.speed*dt+6){
        if(p.aoe>0){
          for(const e of enemies){
            if(dist(p.x,p.y,e.x,e.y)<=p.aoe){ e.hp-=p.damage; if(e.hp<=0) e.dead=true; }
          }
          spawnParticles(p.x,p.y,'#FF9800',12);
        } else if(p.target&&!p.target.dead){
          p.target.hp-=p.damage; if(p.target.hp<=0) p.target.dead=true;
          spawnParticles(p.x,p.y,p.color,5);
        }
        projectiles.splice(i,1); continue;
      }
      p.x+=(dx/d)*p.speed*dt; p.y+=(dy/d)*p.speed*dt;
    }
    // Fim da noite
    if(spawnQueue.length===0&&enemies.length===0){
      state='transition'; transTimer=1.8;
    }
    // Game over
    if(castleHP<=0){ state='over'; castleHP=0; }
  }
  if(state==='transition'){
    transTimer-=dt;
    if(transTimer<=0) startDay();
  }
  // Comum a day/night/transition
  if(state==='day'||state==='night'||state==='transition'){
    // Movimento do jogador
    const dx=player.tx-player.x, dy=player.ty-player.y, d=Math.hypot(dx,dy);
    if(d>3){ const mv=Math.min(player.speed*dt,d); player.x+=dx/d*mv; player.y+=dy/d*mv; }
    // Coleta de moedas
    for(const c of coinDrops){
      if(c.done) continue;
      if(dist(player.x,player.y,c.x,c.y)<58){ coins+=c.amount; c.done=true; spawnParticles(c.x,c.y,'#FFD700',4); }
    }
    coinDrops=coinDrops.filter(c=>!c.done);
    for(const c of coinDrops) c.update(dt);
    // Jogador ataca inimigos próximos (passivo)
    if(state==='night'){
      for(const e of enemies){
        if(!e.dead&&dist(player.x,player.y,e.x,e.y)<player.atkRange+e.size){
          e.hp-=player.atkDmg*dt; if(e.hp<=0) e.dead=true;
        }
      }
    }
    // Partículas
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life-=dt;
      if(p.type==='text'){ p.y+=p.vy*dt; }
      else { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=150*dt; p.vx*=0.92; }
      if(p.life<=0) particles.splice(i,1);
    }
  }
}

/* =============================================
   DRAW LOOP
   ============================================= */
function draw(ctx){
  ctx.clearRect(0,0,W,H);
  if(state==='menu'){ drawMenu(ctx); return; }
  if(state==='over'){ drawBackground(ctx); drawPaths(ctx); drawCastle(ctx); drawGameOver(ctx); return; }
  drawBackground(ctx);
  drawPaths(ctx);
  for(const t of towers) t.draw(ctx);
  drawCastle(ctx);
  for(const c of coinDrops) c.draw(ctx);
  for(const e of enemies) e.draw(ctx);
  // Projéteis
  for(const p of projectiles){
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    if(p.size>5){ ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.stroke(); }
  }
  drawPlayer(ctx);
  // Partículas
  for(const p of particles){
    const a=Math.max(0,p.life/p.maxLife);
    ctx.globalAlpha=a;
    if(p.type==='text'){
      ctx.fillStyle=p.color; ctx.font=`bold ${p.size}px Georgia`; ctx.textAlign='center';
      ctx.fillText(p.text,p.x,p.y);
    } else {
      ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // Overlay noturno
  if(state==='night'||state==='transition'){
    ctx.fillStyle='rgba(0,8,35,0.32)'; ctx.fillRect(0,HUD_H,W,GAME_H);
  }
  drawHUD(ctx);
  drawBuildMenu(ctx);
  // Overlay transição
  if(state==='transition'){
    ctx.fillStyle='rgba(255,215,0,0.08)'; ctx.fillRect(0,0,W,H);
  }
}

/* =============================================
   INPUT
   ============================================= */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
canvas.width=W; canvas.height=H;
canvas.style.maxWidth='100vw'; canvas.style.maxHeight='100vh';

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const sx=W/rect.width, sy=H/rect.height;
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return { x:(cx-rect.left)*sx, y:(cy-rect.top)*sy };
}

function onClick(e){
  const {x,y}=getPos(e);
  if(state==='menu'){
    const bx=W/2-110,by=H*0.78,bw=220,bh=52;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh) startGame();
    return;
  }
  if(state==='over'){
    const bx=W/2-110,by=H*0.68,bw=220,bh=52;
    if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh) state='menu';
    return;
  }
  if(state!=='day'&&state!=='night'&&state!=='transition') return;
  // Menu aberto
  if(buildMenu){
    const types=Object.keys(TOWER_DEFS);
    for(let i=0;i<types.length;i++){
      const btn=buildMenu[`btn${i}`]; if(!btn) continue;
      if(x>=btn.x&&x<=btn.x+btn.w&&y>=btn.y&&y<=btn.y+btn.h){
        const d=TOWER_DEFS[btn.type];
        if(coins>=d.cost){
          coins-=d.cost;
          towers.push(new Tower(buildMenu.c,buildMenu.r,btn.type));
        }
        buildMenu=null; return;
      }
    }
    buildMenu=null; return;
  }
  if(y<HUD_H) return;
  // Dia: abre menu de construção em célula vazia
  if(state==='day'){
    const {c,r}=screenToCell(x,y);
    if(isBuildable(c,r)&&!towers.find(t=>t.c===c&&t.r===r)){
      buildMenu={c,r}; return;
    }
  }
  // Move jogador
  if(y>HUD_H&&y<H&&x>0&&x<W){ player.tx=x; player.ty=y; }
}

function onMove(e){
  if(!buildMenu) return;
  const {x,y}=getPos(e);
  const types=Object.keys(TOWER_DEFS);
  buildMenu.hover=null;
  for(let i=0;i<types.length;i++){
    const btn=buildMenu[`btn${i}`]; if(!btn) continue;
    if(x>=btn.x&&x<=btn.x+btn.w&&y>=btn.y&&y<=btn.y+btn.h) buildMenu.hover=i;
  }
}

canvas.addEventListener('click',onClick);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onClick(e);},{passive:false});
canvas.addEventListener('mousemove',onMove);

/* =============================================
   LOOP PRINCIPAL
   ============================================= */
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05);
  last=ts;
  update(dt);
  draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(loop);});
</script>
